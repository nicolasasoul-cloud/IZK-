<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Chicana Hippie brand: chicanahippie/src/app/globals.css (ochre-archive) */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f2e9d6; }
      #root { position: relative; width: 100%; height: 100%; }
      #footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
      #mark { z-index: 2; }
      #captions { z-index: 3; }
      #endcard { z-index: 4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.8" data-width="1080" data-height="1920">
      <video id="footage" class="clip" src="assets/cut.mp4" data-start="0" data-duration="5.77" data-track-index="0"
        data-has-audio="true" playsinline></video>
      <div id="mark" data-composition-id="mark" data-composition-src="compositions/mark.html"
        data-start="0" data-duration="5.77" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="5.77" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="5.77" data-duration="2.03" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
